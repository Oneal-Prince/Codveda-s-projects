<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Task | TaskFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: "#eef2ff",
                            500: "#6366f1",
                            600: "#4f46e5",
                            700: "#4338ca"
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-slate-100">

    <!-- Navigation -->
    <nav
        class="border-b border-slate-200 bg-white"
        aria-label="Main navigation"
    >

        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <a
                href="/dashboard/"
                class="text-2xl font-bold text-brand-600"
                aria-label="TaskFlow dashboard"
            >
                TaskFlow
            </a>

            <form method="POST" action="{% url 'logout' %}">

                {% csrf_token %}

                <button
                    type="submit"
                    class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
                >
                    Logout
                </button>

            </form>

        </div>

    </nav>


    <!-- Main content -->
    <main class="mx-auto max-w-3xl px-6 py-10">

        <div class="mb-8">

            <a
                href="/dashboard/"
                class="text-sm font-medium text-brand-600 hover:text-brand-700"
            >
                ← Back to Dashboard
            </a>

            <h1 class="mt-4 text-3xl font-bold text-slate-900">
                Create New Task
            </h1>

            <p class="mt-2 text-slate-500">
                Add a new task and keep your work organized.
            </p>

        </div>


        <!-- Form card -->
        <section
            class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm"
            aria-labelledby="task-form-heading"
        >

            <h2
                id="task-form-heading"
                class="sr-only"
            >
                Create task form
            </h2>

            <form method="POST" class="space-y-6">

                {% csrf_token %}


                <!-- Title -->
                <div>

                    <label
                        for="{{ form.title.id_for_label }}"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Task Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        id="{{ form.title.id_for_label }}"
                        value="{{ form.title.value|default:'' }}"
                        placeholder="Enter task title"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20"
                    >

                    {% if form.title.errors %}

                        <div
                            class="mt-2 text-sm text-red-600"
                            role="alert"
                        >
                            {{ form.title.errors }}
                        </div>

                    {% endif %}

                </div>


                <!-- Description -->
                <div>

                    <label
                        for="{{ form.description.id_for_label }}"
                        class="mb-2 block text-sm font-medium text-slate-700"
                    >
                        Description
                    </label>

                    <textarea
                        name="description"
                        id="{{ form.description.id_for_label }}"
                        rows="6"
                        placeholder="Describe your task..."
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none transition focus:border-brand-600 focus:ring-2 focus:ring-brand-500/20"
                    >{{ form.description.value|default:'' }}</textarea>

                    {% if form.description.errors %}

                        <div
                            class="mt-2 text-sm text-red-600"
                            role="alert"
                        >
                            {{ form.description.errors }}
                        </div>

                    {% endif %}

                </div>


                <!-- Buttons -->
                <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">

                    <a
                        href="/dashboard/"
                        class="rounded-lg border border-slate-300 px-5 py-3 text-center font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="rounded-lg bg-brand-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
                    >
                        Create Task
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
