<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Dashboard | TaskFlow</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    brand: {
                        500: "#6366f1",
                        600: "#4f46e5",
                        700: "#4338ca"
                    }
                }
            }
        }
    }
</script>
```

</head>

<body class="min-h-screen bg-slate-100">

```
<!-- Navigation -->
<nav
    class="border-b border-slate-200 bg-white"
    aria-label="Main navigation"
>

    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <a
            href="/dashboard/"
            class="text-2xl font-bold text-brand-600"
            aria-label="TaskFlow home"
        >
            TaskFlow
        </a>

       <form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}

    <button
        type="submit"
        class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
    >
        Logout
    </button>
</form>

    </div>

</nav>


<!-- Main Content -->
<main class="mx-auto max-w-7xl px-6 py-10">

    <!-- Header -->
    <section class="mb-8">

        <p class="text-sm font-medium text-brand-600">
            Dashboard
        </p>

        <h1 class="mt-1 text-3xl font-bold text-slate-900">
            Welcome to your Task Manager
        </h1>

        <p class="mt-2 text-slate-500">
            Organize your work and keep track of your progress.
        </p>

    </section>


    <!-- Empty State -->
    <section
        class="rounded-2xl border border-slate-200 bg-white p-10 text-center shadow-sm"
        aria-labelledby="empty-task-heading"
    >

        <div
            class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-brand-50 text-2xl"
            aria-hidden="true"
        >
            ✓
        </div>

        <h2
            id="empty-task-heading"
            class="mt-5 text-xl font-semibold text-slate-900"
        >
            Your tasks will appear here
        </h2>

        <p class="mx-auto mt-2 max-w-md text-slate-500">
            Start creating tasks to organize your work and keep track
            of everything you need to accomplish.
        </p>

        <button
            type="button"
            class="mt-6 rounded-lg bg-brand-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2"
        >
            + Add Task
        </button>

    </section>

</main>
```

</body>

</html>
